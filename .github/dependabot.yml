version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web-admin
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
