name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"

jobs:
  # ---------------------------------------------------------------- 一致性校验
  verify:
    name: 版本一致性
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tag 必须与包版本一致
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"

  # ---------------------------------------------------------------- 服务端二进制
  server:
    name: Go 服务端 (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          out="dist/easyremote-${V}-${GOOS}-${GOARCH}"
          mkdir -p "$out"
          cd server
          for cmd in admin gateway relay rendezvous stack udptun lossyproxy; do
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o "../$out/$cmd$ext" "./cmd/$cmd"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/easyremote-*
          if-no-files-found: error

  # ---------------------------------------------------------------- Rust 核心产物
  core:
    name: Rust 核心 (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: 构建 cdylib
        run: cargo build --release --manifest-path core/Cargo.toml -p er-ffi
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          out="dist/easyremote-core-${V}-${{ matrix.target }}"
          mkdir -p "$out"
          find core/target/release -maxdepth 1 -type f \
            \( -name '*er_ffi*' -o -name '*er-ffi*' \) -exec cp {} "$out/" \;
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: dist/easyremote-core-*
          if-no-files-found: error

  # ---------------------------------------------------------------- 运营后台
  web-admin:
    name: 运营后台构建
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 打包
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          mkdir -p ../dist
          tar -czf "../dist/easyremote-web-admin-${V}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-admin
          path: dist/easyremote-web-admin-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  publish:
    name: 发布 GitHub Release
    needs: [verify, server, core, web-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集产物并生成校验和
        run: |
          set -euo pipefail
          mkdir -p release
          for d in artifacts/server-*; do
            name=$(basename "$d")
            ( cd artifacts && tar -czf "../release/${name}.tar.gz" "$name" )
          done
          cp artifacts/core-*/* release/ 2>/dev/null || true
          cp artifacts/web-admin/* release/ 2>/dev/null || true
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
