name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

# 客户端烧入的服务端地址。仓库没有配置 ER_GATEWAY 变量时为空串，
# Web 版走同源相对路径，桌面版回落到默认 127.0.0.1。
# 配置方式：Settings → Secrets and variables → Actions → Variables → 新建 ER_GATEWAY
env:
  GO_VERSION: "1.26"
  # 没配置仓库变量时的默认值：本机一体化服务（macOS/Windows 客户端的默认联调地址）
  ER_GATEWAY: ${{ vars.ER_GATEWAY || 'http://127.0.0.1:18090' }}

jobs:
  # ---------------------------------------------------------------- 一致性校验
  verify:
    name: 版本一致性
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tag 必须与包版本一致
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"
      - name: 报告客户端将连接的服务端地址
        run: |
          if [ -n "$ER_GATEWAY" ]; then
            echo "客户端将烧入 ER_GATEWAY=$ER_GATEWAY"
          else
            echo "未配置 ER_GATEWAY：Web 版走同源相对路径，桌面版回落 127.0.0.1:8080"
            echo "::warning title=未配置 ER_GATEWAY::客户端不会指向你的服务器，请在 Settings→Variables 添加 ER_GATEWAY"
          fi

  # ---------------------------------------------------------------- 客户端 Web
  client-web:
    name: 客户端 Web 版
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安装依赖
        working-directory: client
        run: flutter pub get
      - name: 构建 Web（烧入服务端地址）
        working-directory: client
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=ER_GATEWAY="${ER_GATEWAY}"
      - name: 打包
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          out="dist/easyremote-client-web-${V}"
          mkdir -p "$out"
          cp -R client/build/web/. "$out/"
          printf "version: %s\nbuilt_at: %s\ngateway: %s\n" \
            "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${ER_GATEWAY:-<same-origin>}" \
            > "$out/BUILD_INFO.txt"
          tar -czf "dist/easyremote-client-web-${V}.tar.gz" -C dist "easyremote-client-web-${V}"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-web
          path: dist/easyremote-client-web-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- 客户端 macOS
  client-macos:
    name: 客户端 macOS 版
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安装依赖
        working-directory: client
        run: flutter pub get
      # 客户端要能采集/编码/注入，必须有 Rust 核心的动态库；
      # GitHub 的 macos-latest 自带 rustup，直接编 aarch64 Apple 目标。
      - name: 构建 Rust 核心（liber_ffi.dylib）
        working-directory: core
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin || true
          cargo build -p er-ffi --release
          ls -lh target/release/liber_ffi.dylib
      - name: 构建 macOS（烧入服务端地址）
        working-directory: client
        run: |
          flutter build macos --release \
            --dart-define=ER_GATEWAY="${ER_GATEWAY}"
      # 把 dylib 塞进 .app 并重新签名：Flutter 默认的 ad-hoc 签名只覆盖它自己产出的东西，
      # 新增文件后不重签，Gatekeeper 会直接拒绝启动。
      - name: 放入 Rust 核心并重签 .app
        run: |
          set -euo pipefail
          APP="$(ls -d client/build/macos/Build/Products/Release/*.app | head -1)"
          mkdir -p "$APP/Contents/Frameworks"
          cp core/target/release/liber_ffi.dylib "$APP/Contents/Frameworks/"
          codesign --force --sign - "$APP/Contents/Frameworks/liber_ffi.dylib"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -3
      - name: 打包 .app
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          out="dist/easyremote-client-macos-arm64-${V}"
          mkdir -p "$out"
          cp -R client/build/macos/Build/Products/Release/*.app "$out/"
          printf "version: %s\nbuilt_at: %s\ngateway: %s\narch: arm64\n" \
            "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${ER_GATEWAY:-http://127.0.0.1:8080}" \
            > "$out/BUILD_INFO.txt"
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "$out" "${out}.zip" )
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: dist/easyremote-client-macos-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- 服务端（配套，可选下载）
  server:
    name: 服务端 (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          out="dist/easyremote-server-${V}-${GOOS}-${GOARCH}"
          mkdir -p "$out"
          cd server
          for cmd in admin gateway relay rendezvous stack udptun lossyproxy; do
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w" -o "../$out/$cmd$ext" "./cmd/$cmd"
          done
          tar -czf "../$out.tar.gz" -C ../dist "$(basename "$out")"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/easyremote-server-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  publish:
    name: 发布 GitHub Release
    needs: [verify, client-web, client-macos, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集产物与校验和
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -lh release
      - name: 生成发布说明
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GATEWAY: ${{ vars.ER_GATEWAY }}
        run: node scripts/gen-release-notes.mjs
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
