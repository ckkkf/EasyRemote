name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- 契约闸门
  gate:
    name: 契约与规范闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 生成物一致性（错误码 / 契约 / 能力台账）
        run: |
          node scripts/gen-errors.mjs --check
          node scripts/gen-contract.mjs --check
          node scripts/gen-capabilities.mjs --check

      - name: 闸门自测（步骤清单与 CI 对照）
        run: node --test scripts/tests/*.test.mjs

      - name: 禁止模式（httpx / 裸 map，存量基线只减不增）
        run: node scripts/check-forbidden.mjs

      - name: 版本一致性
        run: node scripts/check-version.mjs

      - name: 路由清单 vs 契约
        run: node scripts/check-routes.mjs --strict

      - name: gofmt
        run: |
          out=$(gofmt -l server)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        run: cd server && go vet ./...

      - name: 禁止模式（响应必须走 httpx）
        run: |
          bad=$(grep -rnF --include=*.go -e 'json.NewEncoder' -e 'http.Error(' -e 'w.Write([]byte' \
                server/internal server/cmd 2>/dev/null \
                | grep -v '_test.go' | grep -v 'server/internal/httpx/httpx.go' || true)
          if [ -n "$bad" ]; then echo "以下位置绕过 httpx 写响应："; echo "$bad"; exit 1; fi

  # ---------------------------------------------------------------- 服务端
  go:
    name: Go 服务端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 构建全部入口
        run: |
          cd server
          for cmd in admin gateway lossyproxy relay rendezvous stack udptun; do
            echo "build ./cmd/$cmd"
            go build -o /dev/null ./cmd/$cmd
          done
      - name: 单元测试
        run: cd server && go test -race -coverprofile=cover.out ./...
      - name: 响应信封契约（严格）
        run: cd server && ER_ENVELOPE_STRICT=1 go test ./internal/adminhttp/ -run TestAdminEnvelopeContract
      - name: 覆盖率摘要
        run: |
          cd server
          go tool cover -func=cover.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: server/cover.out
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Rust 核心
  rust:
    name: Rust 核心
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: 安装 Linux 系统依赖
        # core 依赖 libdbus 等系统库（屏幕捕获/输入/剪贴板），Ubuntu runner 默认没有
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libwayland-dev libpipewire-0.3-dev libgbm-dev libdrm-dev
      - name: 格式
        run: cargo fmt --all --manifest-path core/Cargo.toml -- --check
      - name: Clippy（严格：warning 即失败）
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --manifest-path core/Cargo.toml --workspace

  # ---------------------------------------------------------------- 运营后台
  web-admin:
    name: React 运营后台
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 单元测试
        run: npm test -- --run
      - name: 构建
        run: npm run build

  # ---------------------------------------------------------------- Flutter 客户端
  flutter:
    name: Flutter 客户端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 格式（生成物除外）
        run: find lib test -name '*.dart' ! -name '*_gen.dart' ! -name 'contract.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - name: 静态分析（error/warning 必须为 0）
        run: flutter analyze
      - name: 单元与组件测试（Linux 排除桌面 E2E）
        run: flutter test --concurrency=1 --exclude-tags e2e-desktop

  # ---------------------------------------------------------------- 汇总
  ci-status:
    name: CI 结果汇总
    if: always()
    needs: [gate, go, rust, web-admin, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: 判定
        run: |
          echo "gate=${{ needs.gate.result }} go=${{ needs.go.result }} rust=${{ needs.rust.result }} web-admin=${{ needs['web-admin'].result }} flutter=${{ needs.flutter.result }}"
          for r in "${{ needs.gate.result }}" "${{ needs.go.result }}" "${{ needs.rust.result }}" "${{ needs['web-admin'].result }}" "${{ needs.flutter.result }}"; do
            if [ "$r" != "success" ]; then echo "存在未通过的 job"; exit 1; fi
          done
