<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Coastline Cruise — A Pelican on a Bicycle</title>
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ink: #183f3b;
    --coral: #c45f48;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 22px;
    background:
      radial-gradient(1100px 720px at 12% -12%, rgba(235, 175, 115, 0.14), transparent 62%),
      radial-gradient(950px 720px at 90% 112%, rgba(91, 156, 143, 0.26), transparent 62%),
      #0d2a28;
    font-family: var(--sans);
    color: var(--ink);
  }

  .poster {
    position: relative;
    width: min(1280px, calc(100vw - 44px));
    width: min(1280px, calc(100vw - 44px), calc((100svh - 44px) * 1.578947));
    aspect-ratio: 1200 / 760;
    max-height: calc(100svh - 44px);
    overflow: hidden;
    border-radius: 18px;
    background: #f2e6d1;
    box-shadow:
      0 34px 90px rgba(0, 0, 0, 0.42),
      0 3px 0 rgba(255, 255, 255, 0.1) inset;
    isolation: isolate;
    container-type: inline-size;
    -webkit-user-select: none;
    user-select: none;
    animation: poster-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .poster::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: inherit;
    pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(24, 63, 59, 0.2),
      inset 0 0 80px rgba(35, 60, 47, 0.14);
    mix-blend-mode: multiply;
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  #scene .kicker {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.245em;
    fill: #17433e;
  }

  #scene .display {
    font-family: var(--serif);
    font-size: 84px;
    font-weight: 500;
    letter-spacing: -0.035em;
    fill: #173f3b;
  }

  #scene .display-italic {
    font-family: var(--serif);
    font-size: 82px;
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.045em;
    fill: #c45f48;
  }

  #scene .caption {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.035em;
    fill: rgba(23, 63, 59, 0.73);
  }

  #scene .stamp {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-anchor: middle;
    fill: #1c4843;
  }

  #scene .stamp-small {
    font-size: 8.5px;
    letter-spacing: 0.16em;
    opacity: 0.82;
  }

  .control {
    position: absolute;
    right: 26px;
    bottom: 24px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 42px;
    padding: 11px 17px;
    border: 1px solid rgba(24, 63, 59, 0.24);
    border-radius: 999px;
    background: rgba(255, 248, 233, 0.76);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.19em;
    line-height: 1;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: 0 5px 18px rgba(35, 55, 43, 0.14);
    transition: background-color 0.22s ease, transform 0.22s ease, border-color 0.22s ease;
  }

  .control:hover {
    background: rgba(255, 250, 239, 0.96);
    border-color: rgba(24, 63, 59, 0.38);
    transform: translateY(-1px);
  }

  .control:active { transform: translateY(0); }

  .control:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .ctl-icon {
    position: relative;
    display: inline-block;
    flex: 0 0 auto;
    width: 11px;
    height: 12px;
  }

  .control.is-playing .ctl-icon::before,
  .control.is-playing .ctl-icon::after {
    content: "";
    position: absolute;
    top: 0;
    width: 3px;
    height: 12px;
    border-radius: 1px;
    background: currentColor;
  }

  .control.is-playing .ctl-icon::before { left: 1px; }
  .control.is-playing .ctl-icon::after { right: 1px; }

  .control.is-paused .ctl-icon {
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid currentColor;
    margin-right: 2px;
  }

  .control.is-paused .ctl-icon::before,
  .control.is-paused .ctl-icon::after { content: none; }

  @keyframes poster-in {
    from { opacity: 0; transform: translateY(14px) scale(0.995); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 720px) {
    body { padding: 10px; }
    .poster {
      width: min(1280px, calc(100vw - 20px), calc((100svh - 20px) * 1.578947));
      max-height: calc(100svh - 20px);
      border-radius: 13px;
    }
    .control {
      right: 14px;
      bottom: 14px;
      min-height: 38px;
      padding: 9px 13px;
      font-size: 9.5px;
      gap: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .poster { animation: none; }
  }
</style>

<script>
(function () {
  'use strict';

  var get = function (id) { return document.getElementById(id); };
  var poster = get('poster');
  var toggle = get('toggle');
  var toggleLabel = get('toggleLabel');

  var els = {
    wheelRear: get('wheelRear'),
    wheelFront: get('wheelFront'),
    crank: get('crankGroup'),
    pedalNear: get('pedalNear'),
    pedalFar: get('pedalFar'),
    legNear: get('legNear'),
    legFar: get('legFar'),
    footNear: get('footNear'),
    footFar: get('footFar'),
    pelican: get('pelican'),
    head: get('headGroup'),
    pouch: get('pouchGroup'),
    tail: get('tailFeathers'),
    wing: get('wingNear'),
    scarfFront: get('scarfFront'),
    scarfBack: get('scarfBack'),
    cloudTrack: get('cloudTrack'),
    vergeTrack: get('vergeTrack'),
    roadDash: get('roadDash'),
    fishTail: get('fishTail'),
    bell1: get('bellPing1'),
    bell2: get('bellPing2'),
    wind: get('windLines'),
    fgLeft: get('fgLeft'),
    fgRight: get('fgRight')
  };

  var waves = Array.prototype.slice.call(document.querySelectorAll('#scene .wave'));
  var chains = Array.prototype.slice.call(document.querySelectorAll('#scene .chain'));

  var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var running = !motionQuery.matches;
  var clock = 2.2;
  var lastTime = 0;
  var rafId = 0;
  var wheelDegPerSec = 118;
  var crankDegPerSec = 198;
  var roadSpeed = 214;

  var bb = { x: 604, y: 527 };
  var crankRadius = 40;
  var thigh = 95;
  var shin = 105;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function legGeometry(hip, foot) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    distance = clamp(distance, Math.abs(thigh - shin) + 0.2, thigh + shin - 0.2);
    var base = Math.atan2(dy, dx);
    var cosine = (distance * distance + thigh * thigh - shin * shin) / (2 * distance * thigh);
    var alpha = Math.acos(clamp(cosine, -1, 1));
    var kneeAngle = base - alpha;
    return {
      kneeX: hip.x + thigh * Math.cos(kneeAngle),
      kneeY: hip.y + thigh * Math.sin(kneeAngle)
    };
  }

  function placeLeg(node, hip, foot, knee) {
    if (!node) return;
    node.setAttribute('d',
      'M ' + hip.x.toFixed(2) + ' ' + hip.y.toFixed(2) +
      ' L ' + knee.kneeX.toFixed(2) + ' ' + knee.kneeY.toFixed(2) +
      ' L ' + foot.x.toFixed(2) + ' ' + (foot.y - 2).toFixed(2));
  }

  function placeFoot(node, pedal, angle) {
    if (!node) return;
    node.setAttribute('transform',
      'translate(' + pedal.x.toFixed(2) + ' ' + (pedal.y - 2).toFixed(2) + ') rotate(' + angle.toFixed(2) + ')');
  }

  function render(t) {
    var wheelAngle = (t * wheelDegPerSec) % 360;
    if (els.wheelRear) {
      els.wheelRear.setAttribute('transform', 'translate(382 519) rotate(' + wheelAngle.toFixed(2) + ')');
    }
    if (els.wheelFront) {
      els.wheelFront.setAttribute('transform', 'translate(836 519) rotate(' + wheelAngle.toFixed(2) + ')');
    }

    var crankDeg = (t * crankDegPerSec) % 360;
    var crankRad = crankDeg * Math.PI / 180;
    var nearPedal = {
      x: bb.x + crankRadius * Math.cos(crankRad),
      y: bb.y + crankRadius * Math.sin(crankRad)
    };
    var farPedal = {
      x: bb.x - crankRadius * Math.cos(crankRad),
      y: bb.y - crankRadius * Math.sin(crankRad)
    };

    if (els.crank) {
      els.crank.setAttribute('transform', 'rotate(' + crankDeg.toFixed(2) + ' ' + bb.x + ' ' + bb.y + ')');
    }
    if (els.pedalNear) {
      els.pedalNear.setAttribute('transform', 'translate(' + nearPedal.x.toFixed(2) + ' ' + nearPedal.y.toFixed(2) + ')');
    }
    if (els.pedalFar) {
      els.pedalFar.setAttribute('transform', 'translate(' + farPedal.x.toFixed(2) + ' ' + farPedal.y.toFixed(2) + ')');
    }

    var bob = Math.sin(t * 3.42) * 2.4;
    if (els.pelican) {
      els.pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    }
    if (els.head) {
      els.head.setAttribute('transform', 'rotate(' + (Math.sin(t * 3.42 - 0.8) * 1.15).toFixed(2) + ' 700 246)');
    }
    if (els.pouch) {
      els.pouch.setAttribute('transform', 'rotate(' + (Math.sin(t * 5.0) * 1.35).toFixed(2) + ' 758 196)');
    }
    if (els.wing) {
      els.wing.setAttribute('transform', 'rotate(' + (Math.sin(t * 3.42 + 0.55) * 0.8).toFixed(2) + ' 650 275)');
    }
    if (els.tail) {
      els.tail.setAttribute('transform', 'rotate(' + (Math.sin(t * 2.3) * 2.8).toFixed(2) + ' 490 320)');
    }

    var hipNear = { x: 594, y: 374 + bob };
    var hipFar = { x: 579, y: 370 + bob };
    var kneeNear = legGeometry(hipNear, nearPedal);
    var kneeFar = legGeometry(hipFar, farPedal);

    placeLeg(els.legNear, hipNear, nearPedal, kneeNear);
    placeLeg(els.legFar, hipFar, farPedal, kneeFar);
    placeFoot(els.footNear, nearPedal, Math.sin(crankRad) * 4.5);
    placeFoot(els.footFar, farPedal, Math.sin(crankRad + Math.PI) * 4.5);

    var s1 = Math.sin(t * 4.4);
    var s2 = Math.sin(t * 4.4 + 1.15);

    if (els.scarfFront) {
      els.scarfFront.setAttribute('d',
        'M 684 228 C 652 ' + (198 + s1 * 10).toFixed(1) +
        ' 606 ' + (190 - s1 * 4).toFixed(1) +
        ' 548 ' + (206 + s2 * 13).toFixed(1) +
        ' L 566 ' + (219 + s2 * 4).toFixed(1) +
        ' L 536 ' + (228 + s2 * 12).toFixed(1) +
        ' L 562 ' + (237 + s2 * 7).toFixed(1) +
        ' L 544 ' + (250 + s2 * 10).toFixed(1) +
        ' C 598 ' + (257 + s1 * 5).toFixed(1) +
        ' 648 ' + (249 - s2 * 2).toFixed(1) +
        ' 682 243 Z');
    }

    if (els.scarfBack) {
      els.scarfBack.setAttribute('d',
        'M 680 240 C 640 ' + (234 + s2 * 7).toFixed(1) +
        ' 598 ' + (230 - s1 * 5).toFixed(1) +
        ' 560 ' + (242 + s1 * 8).toFixed(1) +
        ' C 600 ' + (250 + s2 * 4).toFixed(1) +
        ' 646 ' + (256 - s1 * 2).toFixed(1) +
        ' 674 251 C 678 248 681 244 680 240 Z');
    }

    if (els.cloudTrack) {
      els.cloudTrack.setAttribute('transform', 'translate(' + (-((t * 11) % 1200)).toFixed(2) + ' 0)');
    }
    if (els.vergeTrack) {
      els.vergeTrack.setAttribute('transform', 'translate(' + (-((t * 168) % 1200)).toFixed(2) + ' 0)');
    }
    if (els.roadDash) {
      els.roadDash.style.strokeDashoffset = String(((t * roadSpeed) % 148).toFixed(2));
    }

    var i;
    for (i = 0; i < waves.length; i++) {
      waves[i].style.strokeDashoffset = String(((t * (11 + i * 2.4)) % 96 + i * 9).toFixed(2));
    }
    for (i = 0; i < chains.length; i++) {
      chains[i].style.strokeDashoffset = String(((t * 90) % 12).toFixed(2));
    }

    if (els.fishTail) {
      els.fishTail.setAttribute('transform', 'rotate(' + (Math.sin(t * 6.2) * 8).toFixed(2) + ')');
    }
    if (els.wind) {
      els.wind.setAttribute('opacity', (0.24 + 0.1 * Math.sin(t * 2.2)).toFixed(3));
      els.wind.setAttribute('transform', 'translate(' + (Math.sin(t * 1.4) * 4).toFixed(1) + ' 0)');
    }
    if (els.fgLeft) {
      els.fgLeft.setAttribute('transform', 'rotate(' + (Math.sin(t * 1.25) * 0.7).toFixed(2) + ' 0 760)');
    }
    if (els.fgRight) {
      els.fgRight.setAttribute('transform', 'rotate(' + (Math.sin(t * 1.25 + 1.7) * 0.55).toFixed(2) + ' 1200 760)');
    }

    var bellPhase = t % 8;
    var pings = [
      { node: els.bell1, delay: 0.05 },
      { node: els.bell2, delay: 0.22 }
    ];

    for (i = 0; i < pings.length; i++) {
      var node = pings[i].node;
      if (!node) continue;
      var age = bellPhase - pings[i].delay;
      if (age >= 0 && age < 0.95) {
        var scale = 0.7 + age * 2.4;
        node.setAttribute('transform', 'translate(815 333) scale(' + scale.toFixed(2) + ')');
        node.setAttribute('opacity', ((1 - age / 0.95) * 0.55).toFixed(2));
      } else {
        node.setAttribute('opacity', '0');
      }
    }
  }

  function syncToggle() {
    if (!toggle || !toggleLabel) return;
    toggle.classList.toggle('is-playing', running);
    toggle.classList.toggle('is-paused', !running);
    toggleLabel.textContent = running ? 'Pause' : 'Play';
    toggle.setAttribute('aria-label', running ? 'Pause animation' : 'Play animation');
    toggle.setAttribute('title', running ? 'Pause animation (Space)' : 'Play animation (Space)');
    if (poster) poster.classList.toggle('is-paused', !running);
  }

  function frame(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.08) dt = 0.08;
    clock += dt;
    render(clock);
    rafId = window.requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    running = true;
    lastTime = 0;
    syncToggle();
    rafId = window.requestAnimationFrame(frame);
  }

  function stop() {
    if (!running) return;
    running = false;
    if (rafId) window.cancelAnimationFrame(rafId);
    rafId = 0;
    syncToggle();
  }

  if (toggle) {
    toggle.addEventListener('click', function () {
      if (running) {
        stop();
      } else {
        start();
      }
    });
  }

  document.addEventListener('keydown', function (event) {
    if (event.code !== 'Space' || event.repeat) return;
    var tag = event.target && event.target.tagName ? event.target.tagName : '';
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'A') return;
    event.preventDefault();
    if (running) {
      stop();
    } else {
      start();
    }
  });

  if (motionQuery.addEventListener) {
    motionQuery.addEventListener('change', function (event) {
      if (event.matches) {
        stop();
      } else {
        syncToggle();
      }
    });
  }

  render(clock);
  syncToggle();
  if (running) {
    rafId = window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
