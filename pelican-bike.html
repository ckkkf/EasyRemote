<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{margin:0;height:100%;background:#0e1626;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  .stage{width:min(96vw,1100px)}
  svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .cap{fill:#8ab4ff;font-size:15px;letter-spacing:.15em;opacity:.85}

  /* ===== 全局动画 ===== */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinBack{to{transform:rotate(-360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes lean{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes legF{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
  @keyframes legR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes wingFlap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
  @keyframes beakOpen{0%,100%{transform:rotate(0deg)}50%{transform:rotate(6deg)}}
  @keyframes scrollL{to{transform:translateX(-1200px)}}
  @keyframes scrollS{to{transform:translateX(-2400px)}}
  @keyframes drift{to{transform:translateX(-1600px)}}
  @keyframes puff{0%{opacity:.9;transform:scale(.4) translate(0,0)}100%{opacity:0;transform:scale(1.6) translate(-90px,-30px)}}
  @keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}

  .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
  .crank{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
  .bike-bob{animation:bob .55s ease-in-out infinite}
  .pelican-lean{transform-box:fill-box;transform-origin:50% 90%;animation:lean 1.1s ease-in-out infinite}
  .leg-front{transform-box:fill-box;transform-origin:50% 0%;animation:legF 1.1s ease-in-out infinite}
  .leg-rear{transform-box:fill-box;transform-origin:50% 0%;animation:legR 1.1s ease-in-out infinite}
  .wing{transform-box:fill-box;transform-origin:15% 15%;animation:wingFlap 1.1s ease-in-out infinite}
  .beak-lower{transform-box:fill-box;transform-origin:0% 0%;animation:beakOpen 2.2s ease-in-out infinite}
  .tail{transform-box:fill-box;transform-origin:100% 50%;animation:tailWag 1.1s ease-in-out infinite}
  .clouds{animation:scrollS 26s linear infinite}
  .hills{animation:scrollL 14s linear infinite}
  .road{animation:drift 3.2s linear infinite}
  .puff{transform-box:fill-box;transform-origin:center;animation:puff 1.1s ease-out infinite}
  .puff.p2{animation-delay:.36s}.puff.p3{animation-delay:.72s}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的循环动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f52"/><stop offset=".6" stop-color="#3a5a8c"/><stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7ee"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffcf5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 / 太阳 -->
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="990" cy="150" r="120" fill="url(#sun)"/>
  <circle cx="990" cy="150" r="52" fill="#ffdf7e"/>

  <!-- 云（循环滚动） -->
  <g class="clouds" opacity=".9">
    <g id="cloudSet">
      <g fill="#ffffff" opacity=".85">
        <ellipse cx="180" cy="120" rx="70" ry="26"/><ellipse cx="230" cy="105" rx="55" ry="22"/>
        <ellipse cx="640" cy="80" rx="80" ry="28"/><ellipse cx="700" cy="64" rx="55" ry="20"/>
        <ellipse cx="1120" cy="150" rx="75" ry="26"/><ellipse cx="1180" cy="134" rx="50" ry="18"/>
        <ellipse cx="1620" cy="120" rx="70" ry="26"/><ellipse cx="1670" cy="105" rx="55" ry="22"/>
        <ellipse cx="2080" cy="80" rx="80" ry="28"/><ellipse cx="2140" cy="64" rx="55" ry="20"/>
      </g>
    </g>
    <use href="#cloudSet" x="2400"/>
  </g>

  <!-- 远山（中速滚动） -->
  <g class="hills">
    <g id="hillSet">
      <path d="M0 520 Q150 400 320 500 T660 490 T1000 505 T1200 480 V700 H0 Z" fill="#274067" opacity=".85"/>
      <path d="M0 560 Q220 470 460 545 T900 540 T1200 550 V700 H0 Z" fill="#1b2c49"/>
    </g>
    <use href="#hillSet" x="1200"/>
  </g>

  <!-- 地面道路 -->
  <rect y="560" width="1200" height="140" fill="#22252c"/>
  <g class="road">
    <g id="dash" fill="#f5d76e">
      <rect x="40" y="622" width="90" height="10" rx="5"/>
      <rect x="240" y="622" width="90" height="10" rx="5"/>
      <rect x="440" y="622" width="90" height="10" rx="5"/>
      <rect x="640" y="622" width="90" height="10" rx="5"/>
      <rect x="840" y="622" width="90" height="10" rx="5"/>
      <rect x="1040" y="622" width="90" height="10" rx="5"/>
      <rect x="1240" y="622" width="90" height="10" rx="5"/>
      <rect x="1440" y="622" width="90" height="10" rx="5"/>
    </g>
    <use href="#dash" x="1600"/>
  </g>

  <!-- ===== 自行车 + 鹈鹕（整体上下颠） ===== -->
  <g class="bike-bob">
    <g transform="translate(600,470)">

      <!-- 后轮 -->
      <g class="wheel" transform="translate(-170,60)">
        <circle r="78" fill="none" stroke="#11141a" stroke-width="12"/>
        <circle r="66" fill="none" stroke="#9aa7b5" stroke-width="4"/>
        <g stroke="#c8d2dc" stroke-width="3">
          <line x1="0" y1="-66" x2="0" y2="66"/><line x1="-57" y1="-33" x2="57" y2="33"/><line x1="-57" y1="33" x2="57" y2="-33"/>
          <line x1="-33" y1="-57" x2="33" y2="57"/><line x1="33" y1="-57" x2="-33" y2="57"/><line x1="-66" y1="0" x2="66" y2="0"/>
        </g>
        <circle r="10" fill="#39424e"/>
      </g>

      <!-- 前轮 -->
      <g class="wheel" transform="translate(170,60)">
        <circle r="78" fill="none" stroke="#11141a" stroke-width="12"/>
        <circle r="66" fill="none" stroke="#9aa7b5" stroke-width="4"/>
        <g stroke="#c8d2dc" stroke-width="3">
          <line x1="0" y1="-66" x2="0" y2="66"/><line x1="-57" y1="-33" x2="57" y2="33"/><line x1="-57" y1="33" x2="57" y2="-33"/>
          <line x1="-33" y1="-57" x2="33" y2="57"/><line x1="33" y1="-57" x2="-33" y2="57"/><line x1="-66" y1="0" x2="66" y2="0"/>
        </g>
        <circle r="10" fill="#39424e"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e0564b" stroke-width="12" stroke-linecap="round" fill="none">
        <line x1="-170" y1="60" x2="-30" y2="60"/>            <!-- 后轴-中轴 -->
        <line x1="-30" y1="60" x2="120" y2="-70"/>           <!-- 下管 -->
        <line x1="-170" y1="60" x2="-90" y2="-80"/>          <!-- 立管 -->
        <line x1="-90" y1="-80" x2="120" y2="-70"/>          <!-- 上管 -->
        <line x1="120" y1="-70" x2="170" y2="60"/>           <!-- 前叉 -->
      </g>
      <!-- 车座 -->
      <line x1="-90" y1="-80" x2="-90" y2="-104" stroke="#39424e" stroke-width="8"/>
      <rect x="-118" y="-116" width="56" height="14" rx="7" fill="#2a2f38"/>
      <!-- 车把 -->
      <line x1="120" y1="-70" x2="128" y2="-104" stroke="#39424e" stroke-width="8"/>
      <path d="M128 -104 q26 -6 30 14" stroke="#2a2f38" stroke-width="9" fill="none" stroke-linecap="round"/>

      <!-- 中轴曲柄+脚蹬（旋转） -->
      <g class="crank" transform="translate(-30,60)">
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#2a2f38" stroke-width="9" stroke-linecap="round"/>
        <rect x="-18" y="-46" width="36" height="12" rx="6" fill="#11141a"/>
        <rect x="-18" y="34" width="36" height="12" rx="6" fill="#11141a"/>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <g class="pelican-lean" transform="translate(-40,-120)">
        <!-- 尾羽 -->
        <g class="tail" transform="translate(-88,-6)">
          <path d="M0 0 q-46 -8 -70 6 q26 8 42 4 q-20 14 -44 12 q32 14 72 -8 Z" fill="#cdd8e2"/>
        </g>
        <!-- 后腿（踩下侧脚蹬） -->
        <g class="leg-rear" transform="translate(-20,66)">
          <path d="M0 0 q10 44 2 92" stroke="#ff9d5c" stroke-width="11" fill="none" stroke-linecap="round"/>
          <path d="M2 92 l22 6" stroke="#ff9d5c" stroke-width="9" stroke-linecap="round"/>
        </g>
        <!-- 身体 -->
        <ellipse cx="0" cy="10" rx="92" ry="70" fill="url(#body)"/>
        <ellipse cx="6" cy="34" rx="62" ry="40" fill="#f4f8fb"/>
        <!-- 翅膀（扇动） -->
        <g class="wing" transform="translate(-10,-24)">
          <path d="M0 0 q-66 26 -78 92 q52 6 88 -34 q22 -28 -10 -58 Z" fill="#b9c8d6"/>
          <path d="M-64 74 q40 2 66 -26" stroke="#93a6b8" stroke-width="4" fill="none"/>
        </g>
        <!-- 前腿（踩上侧脚蹬） -->
        <g class="leg-front" transform="translate(8,70)">
          <path d="M0 0 q-14 40 -6 88" stroke="#ff8c42" stroke-width="11" fill="none" stroke-linecap="round"/>
          <path d="M-6 88 l22 6" stroke="#ff8c42" stroke-width="9" stroke-linecap="round"/>
        </g>
        <!-- 脖子+头 -->
        <path d="M52 -34 q34 -30 60 -34" stroke="#eef4f9" stroke-width="34" fill="none" stroke-linecap="round"/>
        <circle cx="122" cy="-78" r="34" fill="url(#body)"/>
        <!-- 眼睛 -->
        <circle cx="132" cy="-86" r="5.5" fill="#1a1e26"/>
        <circle cx="133.8" cy="-87.8" r="1.8" fill="#fff"/>
        <!-- 上喙（长喙） -->
        <path d="M146 -90 q92 6 116 34 q-66 8 -118 -8 Z" fill="url(#beak)"/>
        <!-- 下喙喉囊（张合） -->
        <g class="beak-lower" transform="translate(146,-80)">
          <path d="M0 4 q70 44 108 22 q-38 34 -104 12 q-14 -18 -4 -34 Z" fill="#ff7a3d" opacity=".95"/>
        </g>
        <!-- 头顶呆毛 -->
        <path d="M112 -110 q-4 -14 6 -18 M124 -112 q2 -14 12 -16" stroke="#cdd8e2" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 后轮扬起的速度尘团 -->
      <g transform="translate(-250,120)">
        <circle class="puff" cx="0" cy="0" r="14" fill="#e8eef5"/>
        <circle class="puff p2" cx="-14" cy="-8" r="10" fill="#e8eef5"/>
        <circle class="puff p3" cx="6" cy="-14" r="8" fill="#e8eef5"/>
      </g>
    </g>
  </g>

  <text class="cap" x="40" y="52">PELICAN · RIDE</text>
</svg>
</div>
</body>
</html>
